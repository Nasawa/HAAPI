.endpoint_target: &endpoint_target
  target:
    device:
      integration: haapi

last_call_succeeded: *endpoint_target

response_contains:
  target:
    device:
      integration: haapi
  fields:
    pattern:
      required: true
      example: '"state":\s*"FINISH"'
      selector:
        text:

value_is:
  target:
    device:
      integration: haapi
  fields:
