version: 2

updates:
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/test_servers"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      routine-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      routine-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
