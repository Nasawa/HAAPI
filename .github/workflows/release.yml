name: Release

# Publishes a GitHub Release whenever the version in manifest.json is bumped on
# main. It runs after CI succeeds on a push to main, so a red build never ships.
# Pushes that don't change the version are a no-op (the tag already exists).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Create release if version is new
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(jq -r .version custom_components/haapi/manifest.json)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::No version in manifest.json"
            exit 1
          fi
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1 || \
             git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists; nothing to release."
            exit 0
          fi
          gh release create "$tag" --target "$SHA" --title "$tag" --generate-notes
